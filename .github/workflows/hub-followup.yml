name: Hub follow-up regressions

on: [push, pull_request]

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.10', '3.13']
    runs-on: ${{ matrix.os }}
    env:
      PYTHONUTF8: '1'
    defaults:
      run:
        working-directory: projects/wechat-intelligence-hub
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python }}
      - name: Check follow-up and existing Hub behavior with synthetic data
        run: |
          python -m unittest discover -s tests -p test_followup_regressions.py -v
          python -m unittest discover -s tests -p test_intelligence_views.py -v
          python -m unittest discover -s tests -p test_opportunities.py -v
          python -m unittest discover -s tests -p test_profile.py -v
          python -m unittest discover -s tests -p test_group_links.py -v
